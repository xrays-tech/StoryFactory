# P1 基础（phase-01）：StoryArchitect AI v4.0 单 crate 服务骨架
[package]
name = "story-architect"
version = "4.0.0"
edition = "2021"
rust-version = "1.98.0"

[dependencies]
axum = "0.7.9"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["limit", "cors"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "migrate", "macros", "runtime-tokio"] }
config = "0.14.1"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "1.0.69"
uuid = { version = "1.29.0", features = ["v4"] }
dashmap = "6.2.1"
secrecy = { version = "0.10.3", features = ["serde"] }
rust-embed = "8.13.0"
arc-swap = "1.9.3"
webbrowser = "0.7.1"
validator = { version = "0.13.0", features = ["derive"] }
once_cell = "1.21.4"
anyhow = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "http2"] }
jsonschema = "0.26"
minijinja = "2"
async-trait = "0.1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
hex = "0.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-appender = "0.2.5"
ts-rs = "10"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
