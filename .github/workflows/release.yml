name: Release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          BIN=story-architect
          [[ "${{ matrix.target }}" == *windows* ]] && BIN=story-architect.exe
          OUT="dist/${{ matrix.target }}"
          mkdir -p "$OUT"
          cp "target/${{ matrix.target }}/release/$BIN" "$OUT/"
          cp README.md LICENSE* "$OUT/" 2>/dev/null || true
          (cd "$OUT" && sha256sum "$BIN" > "$BIN.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: story-architect-${{ matrix.target }}
          path: dist/${{ matrix.target }}
